name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cari folder proyek
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."
            exit 1
          fi
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
          echo "Proyek ditemukan di: $(dirname "$F")"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Tanpa android-actions/setup-android: runner sudah punya Android SDK,
      # dan action itu gagal karena mencoba memasang paket "tools" yang sudah dihapus Google.
      - name: Siapkan Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "SDK di: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build kedua APK
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon :phone:assembleDebug :glasses:assembleDebug

      - name: Kumpulkan hasil
        run: |
          mkdir -p hasil
          cp "$PROJ/phone/build/outputs/apk/debug/phone-debug.apk"     hasil/1-NalaHUD-HP.apk
          cp "$PROJ/glasses/build/outputs/apk/debug/glasses-debug.apk" hasil/2-NalaHUD-KACAMATA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: APK-NalaHUD
          path: hasil/
